pipeline:
  name: devtrack-release
  id: devtrack_release
  description: Validate reviewed main, publish its immutable image, migrate once, deploy, and smoke test.
  timeout: 1h
  repo:
    connector: github
    name: devtrack
  clone:
    enabled: true
    ref: <+input>
  inputs:
    release_enabled:
      type: boolean
      default: false
      description: Keep false until the no-charge hosting decision and cloud setup are complete.
    gcp_project:
      type: string
      required: true
      description: The approved Google Cloud project ID.
    region:
      type: string
      default: us-central1
    artifact_repository:
      type: string
      default: devtrack
    application_origin:
      type: string
      required: true
      description: Exact HTTPS Cloud Run service origin, without a trailing slash.
    runtime_service_account:
      type: string
      required: true
    database_secret_version:
      type: string
      default: '1'
  stages:
    - name: Validate
      id: Validate
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - name: Verify reviewed release source
          id: Source
          run:
            shell: sh
            env:
              RELEASE_ENABLED: ${{ inputs.release_enabled }}
            script: |-
              set -eu
              [ "$RELEASE_ENABLED" = true ] || { echo 'Cloud release is disabled pending account setup.' >&2; exit 1; }
              COMMIT_SHA=$(sh infrastructure/harness/scripts/verify-release-source.sh)
              printf 'COMMIT_SHA=%s\n' "$COMMIT_SHA" >> "$HARNESS_OUTPUT"
        - name: Install pinned tools and dependencies
          id: Install
          run:
            shell: sh
            script: |-
              set -eu
              sh infrastructure/harness/scripts/setup-node.sh
              export PATH="$PWD/.ci/node/bin:$PATH"
              npm ci
        - name: Format schema and lint
          id: Lint
          run:
            shell: sh
            script: |-
              set -eu
              export PATH="$PWD/.ci/node/bin:$PATH"
              npm run format:check
              npm run db:validate
              npm run lint
        - name: Strict TypeScript
          id: Typecheck
          run:
            shell: sh
            script: |-
              set -eu
              export PATH="$PWD/.ci/node/bin:$PATH"
              npm run typecheck
        - name: Unit and frontend tests
          id: Unit_tests
          run:
            shell: sh
            script: |-
              set -eu
              export PATH="$PWD/.ci/node/bin:$PATH"
              npm test
        - name: PostgreSQL integration and coverage
          id: Database_tests
          run:
            shell: sh
            script: |-
              set -eu
              export PATH="$PWD/.ci/node/bin:$PATH"
              trap 'docker compose --env-file .env.example --profile test stop db-test' EXIT
              npm run test:integration
              npm run test:coverage
        - name: Production build
          id: Build
          run:
            shell: sh
            script: |-
              set -eu
              export PATH="$PWD/.ci/node/bin:$PATH"
              npm run build
    - name: Package
      id: Package
      needs: Validate
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - name: Recheck main before publishing
          id: Source
          run:
            shell: sh
            script: sh infrastructure/harness/scripts/verify-release-source.sh
        - name: Publish commit image to Google Artifact Registry
          id: Publish
          template:
            uses: buildAndPushToGAR@1.0.0
            with:
              connector: gcp
              project: ${{ inputs.gcp_project }}
              repo: ${{ inputs.region }}-docker.pkg.dev/${{ inputs.gcp_project }}/${{ inputs.artifact_repository }}/devtrack
              tags:
                - ${{ stages.Validate.output.COMMIT_SHA }}
              caching: true
              dockerfile: Dockerfile
              context: .
              target: runtime
              buildargs:
                APP_VERSION: ${{ stages.Validate.output.COMMIT_SHA }}
    - name: Deploy Production
      id: Deploy_Production
      needs: Package
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      service:
        type: google-cloud-run
        items:
          - devtrack
      environment:
        items:
          - id: production
            deploy-to:
              - cloud_run
      steps:
        - name: Recheck main before deployment
          id: Source
          run:
            shell: sh
            script: sh infrastructure/harness/scripts/verify-release-source.sh
        - name: Install migration and smoke tools
          id: Install
          run:
            shell: sh
            script: |-
              set -eu
              sh infrastructure/harness/scripts/setup-node.sh
              export PATH="$PWD/.ci/node/bin:$PATH"
              npm ci
        - name: Migrate production once
          id: Migrate
          run:
            shell: sh
            env:
              NODE_ENV: production
              APP_VERSION: ${{ stages.Validate.output.COMMIT_SHA }}
              APP_ORIGIN: ${{ inputs.application_origin }}
              DATABASE_URL: ${{ secrets.production_database_url }}
            script: |-
              set -eu
              export PATH="$PWD/.ci/node/bin:$PATH"
              npm run db:migrate:production
        - name: Deploy the published artifact
          id: Deploy
          template:
            uses: googleCloudRunDeployStep
            with:
              gcp_connector: gcp
              project: ${{ inputs.gcp_project }}
              region: ${{ inputs.region }}
              log_level: info
        - name: Verify deployed health and commit
          id: Smoke
          run:
            shell: sh
            env:
              APPLICATION_ORIGIN: ${{ inputs.application_origin }}
              EXPECTED_COMMIT: ${{ stages.Validate.output.COMMIT_SHA }}
            script: |-
              set -eu
              export PATH="$PWD/.ci/node/bin:$PATH"
              npm run smoke:deployment -- "$APPLICATION_ORIGIN" "$EXPECTED_COMMIT"
