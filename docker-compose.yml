services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: devtrack_dev
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devtrack -d devtrack_dev']
      interval: 2s
      timeout: 5s
      retries: 15

  db-test:
    image: postgres:18.6-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack_test
      POSTGRES_DB: devtrack_test
      TZ: UTC
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devtrack -d devtrack_test']
      interval: 2s
      timeout: 5s
      retries: 15

  db-e2e:
    image: postgres:18.6-alpine
    profiles: ['e2e']
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack_e2e
      POSTGRES_DB: devtrack_e2e
      TZ: UTC
    ports:
      - '127.0.0.1:5434:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devtrack -d devtrack_e2e']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
